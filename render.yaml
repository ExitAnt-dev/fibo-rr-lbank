services:
  - type: worker
    name: exitant-fibo-rr-lbank
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    image:
      url: docker.io/exitant/exitant-fibo-rr-lbank:latest
    disk:
      name: fibo-rr-lbank-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
